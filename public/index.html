<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grade Center</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Learn</span>
    <span class="course">ENG 101 · Composition I (Fall 2026)</span>
    <a class="topbar-link" id="student-view" hidden></a>
  </header>

  <main>
    <nav class="crumbs">Grade Center › Full Grade Center</nav>

    <section class="toolbar">
      <div>
        <h1 id="title">Loading…</h1>
        <p id="due" class="muted"></p>
      </div>
      <div class="actions">
        <a class="button secondary" href="roster.html">Edit roster</a>
        <a class="button secondary" href="assignment.html">Edit rubric &amp; instructions</a>
        <button id="grade-all" title="Grades every submission that isn't final">Grade all with agent</button>
      </div>
    </section>
    <p id="message" class="message" hidden></p>
    <p id="outdated" class="notice" hidden></p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Last Name</th><th>First Name</th><th>Username / Email</th><th>Student ID</th>
            <th>Submitted</th><th>Grade</th><th>Status</th><th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="muted hint">Click a row to open the submission.</p>
  </main>

  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
